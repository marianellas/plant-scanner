name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic flake8 mypy pytest

      - name: flake8
        working-directory: plant-id
        run: flake8 . --exclude=tests/

      - name: mypy
        working-directory: plant-id
        run: mypy . --exclude=tests/

      - name: pytest
        working-directory: plant-id
        run: pytest tests/ -v
